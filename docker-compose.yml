services:
  # Service 1: FastAPI REST Microservice
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visiontrack_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Service 2: Streamlit Interactive Operator Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visiontrack_dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "dashboard.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./outputs:/app/outputs
    depends_on:
      api:
        condition: service_healthy
